name: Update Device Dictionary

on:
  schedule:
    - cron: '0 0 * * 0' # Todos los domingos a medianoche
  workflow_dispatch: # Permite ejecución manual

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        run: python scripts/update_devices.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add devices.json
          if git diff --cached --quiet; then
            echo "No se detectaron cambios en el diccionario de dispositivos."
          else
            git commit -m "System: Actualizar diccionario de dispositivos (Google Play List)"
            git push
          fi
