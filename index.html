<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaPlay | Security</title>
    <link rel="icon" type="image/webp" href="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #e50914;
            --primary-hover: #ff000d;
            --bg: #050505;
            --card-bg: #111111;
            --input-bg: #1a1f2e;
            --text: #ffffff;
            --text-muted: #888888;
            --border: #293246;
            --success: #10b981;
            --error: #ef4444;
            --nav-height: 70px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }

        /* Navigation */
        nav { position: fixed; top: 0; width: 100%; height: var(--nav-height); background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); z-index: 1000; display: flex; align-items: center; padding: 0 30px; justify-content: space-between; }
        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; font-weight: 900; font-size: 20px; }
        .brand img { width: 32px; border-radius: 6px; }

        .nav-links { display: flex; gap: 15px; align-items: center; }
        .nav-links a { color: #ccc; text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.2s; padding: 10px 15px; border-radius: 10px; }
        .nav-links a:hover { color: #fff; background: rgba(255,255,255,0.05); }

        /* Main Layout */
        .app-container { max-width: 1400px; margin: calc(var(--nav-height) + 40px) auto; padding: 0 20px; display: flex; flex-direction: column; gap: 30px; }

        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 25px; padding: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); display: flex; flex-direction: column; }
        .card h2 { font-size: 20px; font-weight: 900; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        .card h2 i { color: var(--primary); }

        /* Table Styles */
        .table-container { flex-grow: 1; overflow-y: auto; max-height: 400px; margin-top: 10px; border-radius: 15px; background: #080a10; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #1a1f2e; color: var(--text-muted); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; padding: 15px; position: sticky; top: 0; z-index: 5; }
        td { padding: 15px; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #ccc; }
        tr:hover { background: rgba(255,255,255,0.02); }

        .badge { padding: 4px 10px; border-radius: 20px; font-size: 9px; font-weight: 900; text-transform: uppercase; }
        .badge-green { background: rgba(16,185,129,0.1); color: var(--success); }

        /* Forms */
        input { padding: 14px 18px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; color: #fff; font-size: 14px; transition: 0.2s; }
        input:focus { border-color: var(--primary); }

        .btn { padding: 12px 20px; border-radius: 12px; border: 0; cursor: pointer; font-weight: 800; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; white-space: nowrap; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-danger { background: var(--error); color: #fff; }
        .btn-icon { background: none; border: none; color: inherit; cursor: pointer; padding: 5px; opacity: 0.6; }
        .btn-icon:hover { opacity: 1; color: var(--primary); }

        /* Log Monitor */
        .logs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 20px; }
        .log-item { background: #080a10; border: 1px solid var(--border); padding: 20px; border-radius: 20px; transition: 0.3s; }
        .log-item:hover { border-color: var(--primary); }
        .log-item h4 { font-size: 13px; word-break: break-all; margin-bottom: 10px; color: #fff; }

        #auth-view { position: fixed; inset: 0; background: var(--bg); z-index: 10001; display: flex; justify-content: center; align-items: center; }
        .auth-card { width: 400px; padding: 50px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 35px; text-align: center; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<nav>
    <a href="#" class="brand"><img src="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp"> NovaPlay Security</a>
    <div class="nav-links">
        <a href="https://novaplaytv.github.io/">INICIO</a>
        <a href="https://novaplaytv.github.io/novaimg/actualizar-icono/">ICONOS</a>
        <a href="https://novaplaytv.github.io/panel-canales/">CANALES</a>
        <button class="btn btn-primary" id="navLogout" style="display:none;" onclick="cerrarSesion()">SALIR</button>
    </div>
</nav>

<div id="auth-view">
    <div class="auth-card">
        <h2 style="margin-bottom:30px; font-weight:900;">Acceso Staff</h2>
        <input type="text" id="username" placeholder="Usuario" style="width:100%; margin-bottom:15px;">
        <input type="password" id="password" placeholder="Contraseña" style="width:100%; margin-bottom:20px;">
        <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="iniciarSesion()">ENTRAR</button>
    </div>
</div>

<div class="app-container hidden" id="main-panel">
    <div class="card">
        <h2><i class="fas fa-bolt"></i> Sesiones Activas (Detección de Firma)</h2>
        <div class="table-container">
            <table>
                <thead><tr><th>Usuario</th><th>ID Hardware</th><th>Firma Hardware</th><th>Modelo</th><th>Acción</th></tr></thead>
                <tbody id="users-tbody"></tbody>
            </table>
        </div>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:30px;">
        <div class="card">
            <h2><i class="fas fa-user-slash"></i> Lista Negra</h2>
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <input type="text" id="blacklist-id" placeholder="ID o Firma..." style="flex:1;">
                <button class="btn btn-danger" onclick="addBlacklist()">BLOQUEAR</button>
            </div>
            <div class="table-container" style="max-height: 300px;">
                <table><thead><tr><th>ID / Firma Baneada</th><th>Acción</th></tr></thead><tbody id="blacklist-tbody"></tbody></table>
            </div>
        </div>
        <div class="card">
            <h2><i class="fas fa-file-medical-alt"></i> Últimos Logs</h2>
            <div class="logs-grid" id="logs-container" style="overflow-y:auto; max-height:400px;"></div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://mrghnngupolsgatcmevw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_56epBVQKxWC5_OF0O8x0pA_gxDsxMbQ";
    const API_URL = `${SUPABASE_URL}/functions/v1/actualizar-canales`;
    let sessionToken = localStorage.getItem("novaplay_session_token") || "";

    async function req(body) {
        const h = { "Content-Type": "application/json" };
        if (sessionToken) h.Authorization = "Bearer " + sessionToken;
        const r = await fetch(API_URL, { method: "POST", headers: h, body: JSON.stringify(body) });
        return await r.json();
    }

    async function iniciarSesion() {
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;
        const res = await req({ action: "login", username: u, password: p });
        if (res.token) { sessionToken = res.token; localStorage.setItem("novaplay_session_token", res.token); location.reload(); }
        else alert("Denegado");
    }

    function cerrarSesion() { localStorage.removeItem("novaplay_session_token"); location.reload(); }

    async function loadData() {
        if (!sessionToken) return;
        document.getElementById("auth-view").classList.add("hidden");
        document.getElementById("main-panel").classList.remove("hidden");
        document.getElementById("navLogout").style.display = "block";

        // Cargar Usuarios
        const users = await supabaseRequest("registro_versiones", "GET", null, "?select=*&order=fecha_actualizacion.desc");
        document.getElementById('users-tbody').innerHTML = users.map(u => `
            <tr>
                <td><b>${u.usuario}</b></td>
                <td><code title="ID Hardware">${u.novaplay_id}</code></td>
                <td><code style="color:var(--primary)" title="Firma Blindada">${u.firma_hardware || 'N/A'}</code></td>
                <td>${u.modelo_dispositivo}</td>
                <td>
                    <button class="btn-icon" onclick="addBlacklist('${u.novaplay_id}')" title="Banear por ID"><i class="fas fa-id-badge"></i></button>
                    <button class="btn-icon" onclick="addBlacklist('${u.firma_hardware}')" title="Banear por Firma" ${u.firma_hardware ? '' : 'disabled'}><i class="fas fa-fingerprint" style="color:var(--primary)"></i></button>
                </td>
            </tr>
        `).join('');

        // Cargar Blacklist
        const black = await supabaseRequest("blacklist", "GET", null, "?select=*&order=created_at.desc");
        document.getElementById('blacklist-tbody').innerHTML = black.map(b => `
            <tr><td><code>${b.novaplay_id}</code></td><td><button class="btn-icon" onclick="removeBlacklist(${b.id})"><i class="fas fa-trash"></i></button></td></tr>
        `).join('');

        // Cargar Logs
        const logs = await req({ action: "listar_logs" });
        document.getElementById('logs-container').innerHTML = logs.map(l => `
            <div class="log-item">
                <h4>${l.name}</h4>
                <a href="https://wxlhqitmigmkpfcsqyzt.supabase.co/storage/v1/object/public/Logs_NovaPlay/${l.name}" target="_blank" class="btn btn-primary" style="padding:5px 10px; font-size:10px;">VER REPORTE</a>
            </div>
        `).join('');
    }

    async function supabaseRequest(table, method, body = null, query = "") {
        const h = { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" };
        const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}${query}`, { method, headers: h, body: body ? JSON.stringify(body) : null });
        return await r.json();
    }

    async function addBlacklist(id = null) {
        const val = id || document.getElementById('blacklist-id').value.trim();
        if (!val) return;
        const res = await supabaseRequest("blacklist", "POST", { novaplay_id: val });
        if (res.error) {
            alert("Error al bloquear: " + (res.error.message || "Permiso denegado"));
        } else {
            alert("Baneado con éxito: " + val);
            loadData();
        }
    }

    async function removeBlacklist(id) {
        await supabaseRequest("blacklist", "DELETE", null, `?id=eq.${id}`);
        loadData();
    }

    if (sessionToken) loadData();
</script>
</body>
</html>
