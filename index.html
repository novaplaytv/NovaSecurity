<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NovaPlay | Security</title>
    <link rel="icon" type="image/webp" href="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #e50914;
            --primary-hover: #b91c1c;
            --bg: #080a10;
            --card-bg: #11151f;
            --input-bg: #1a1f2e;
            --text: #ffffff;
            --text-muted: #9aa3b2;
            --border: #293246;
            --success: #10b981;
            --error: #ef4444;
            --nav-height: 70px;
        }

        * { box-sizing: border-box; outline: none; margin: 0; padding: 0; }
        html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }

        /* Navegación Premium (Igual a panel-canales) */
        .nova-nav { position: fixed; top: 0; width: 100%; z-index: 10000; background: rgba(0,0,0,0.7); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .nav-inner { max-width: 1400px; margin: auto; height: var(--nav-height); padding: 0 30px; display: flex; align-items: center; justify-content: space-between; }
        .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; font-weight: 900; font-size: 22px; letter-spacing: -1px; }
        .nav-brand img { width: 36px; height: 32px; border-radius: 8px; }

        .nav-links { display: flex; gap: 15px; align-items: center; }
        .nav-links a { color: #ccc; text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.2s; padding: 10px 15px; border-radius: 10px; }
        .nav-links a:hover { color: #fff; background: rgba(255,255,255,0.05); }

        .btn-login-nav, .btn-logout {
            background: var(--primary);
            color: #fff !important;
            font-weight: 800 !important;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
            border: none;
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            display: none;
            transition: 0.2s;
        }
        .btn-login-nav:hover, .btn-logout:hover { transform: scale(1.05); background: var(--primary-hover); }
        .btn-logout { background: var(--error); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }

        .app-container { display: flex; flex-direction: column; height: calc(100% - var(--nav-height)); margin-top: var(--nav-height); overflow-y: auto; padding: 40px 20px; gap: 30px; align-items: center; }

        /* Dashboard Cards */
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 25px; padding: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); display: flex; flex-direction: column; width: 100%; max-width: 1300px; }
        .card h2 { font-size: 20px; font-weight: 900; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; text-transform: uppercase; }
        .card h2 i { color: var(--primary); }

        /* Tables */
        .table-container { overflow-x: auto; border-radius: 15px; background: #080a10; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #1a1f2e; color: var(--text-muted); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; padding: 15px; position: sticky; top: 0; }
        td { padding: 15px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #ccc; }
        tr:hover { background: rgba(255,255,255,0.02); }

        code { font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 4px 8px; background: #1a1f2e; border-radius: 6px; }

        /* Action Buttons */
        .btn-icon { background: none; border: none; color: inherit; cursor: pointer; padding: 8px; border-radius: 8px; transition: 0.2s; }
        .btn-icon:hover { background: rgba(255,255,255,0.1); color: var(--primary); }
        .btn-danger-text { background: rgba(239,68,68,0.1); color: var(--error); padding: 6px 15px; border-radius: 10px; font-size: 11px; font-weight: 900; border: none; cursor: pointer; }
        .btn-danger-text:hover { background: var(--error); color: #fff; }

        /* Auth View */
        #auth-view { position: fixed; inset: 0; background: var(--bg); z-index: 10001; display: flex; justify-content: center; align-items: center; }
        .auth-card { width: 400px; padding: 50px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 35px; text-align: center; }
        .auth-card input { width: 100%; padding: 15px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; color: #fff; margin-bottom: 15px; }
        .status { margin-top: 15px; color: var(--error); font-weight: 800; font-size: 13px; display: none; }

        /* Logs Grid */
        .logs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 20px; }
        .log-item { background: #080a10; border: 1px solid var(--border); padding: 20px; border-radius: 20px; display: flex; flex-direction: column; gap: 10px; }
        .log-item h4 { font-size: 13px; word-break: break-all; color: #fff; flex-grow: 1; }

        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        footer { padding: 60px 20px; background: #000; border-top: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .footer-text { font-size: 13px; color: #444; line-height: 1.8; font-weight: 600; }
    </style>
</head>
<body>

<nav class="nova-nav">
    <div class="nav-inner">
        <a class="nav-brand" href="#">
            <img src="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp">
            NOVAPLAY SECURITY
        </a>
        <div class="nav-links">
            <a href="https://novaplaytv.github.io/">INICIO</a>
            <a href="https://novaplaytv.github.io/NovaApps/">DESCARGAS</a>
            <a href="https://novaplaytv.github.io/panel-canales/">CANALES</a>
            <a href="#" onclick="loadData(); return false;" id="navReload" style="display:none; color: var(--success); font-weight: 800;"><i class="fas fa-sync-alt"></i> RECARGAR</a>
            <button class="btn-login-nav" id="navLogin" onclick="UI_MostrarLogin()">INGRESAR</button>
            <button class="btn-logout" id="navLogout" onclick="cerrarSesion()">SALIR</button>
        </div>
    </div>
</nav>

<div id="auth-view" class="hidden">
    <div class="auth-card">
        <h2 style="margin-bottom:30px; font-weight:900; font-size: 28px;">Acceso al Panel</h2>
        <div class="form-group" style="text-align: left; margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-size: 11px; font-weight: 900; color: var(--text-muted); text-transform: uppercase;">Usuario</label>
            <input type="text" id="username" placeholder="Usuario Staff">
        </div>
        <div class="form-group" style="text-align: left; margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-size: 11px; font-weight: 900; color: var(--text-muted); text-transform: uppercase;">Contraseña</label>
            <input type="password" id="password" placeholder="Contraseña">
        </div>
        <button class="btn btn-primary" id="loginButton" style="width:100%; justify-content:center; padding: 18px;" onclick="iniciarSesion()">ENTRAR AL PANEL</button>
        <div id="loginStatus" class="status"></div>
    </div>
</div>

<div class="app-container hidden" id="main-panel">
    <div class="card">
        <h2><i class="fas fa-bolt"></i> Sesiones en Tiempo Real</h2>
        <div class="table-container">
            <table>
                <thead><tr><th>Usuario</th><th>ID Hardware</th><th>Firma Hardware</th><th>Modelo / App</th><th>Acción</th></tr></thead>
                <tbody id="users-tbody"></tbody>
            </table>
        </div>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:30px; width: 100%; max-width: 1300px;">
        <div class="card">
            <h2><i class="fas fa-user-slash"></i> Lista Negra</h2>
            <div class="table-container">
                <table><thead><tr><th>ID / Firma Baneada</th><th>Acción</th></tr></thead><tbody id="blacklist-tbody"></tbody></table>
            </div>
        </div>
        <div class="card">
            <h2><i class="fas fa-file-medical-alt"></i> Reportes de Emergencia</h2>
            <div id="logs-container" class="logs-grid" style="overflow-y:auto; max-height:400px;"></div>
        </div>
    </div>
</div>

<footer>
    <div class="footer-text">
        © 2026 NOVAPLAY TV<br>
        © 2010 - 2026 - MSGT. TODOS LOS DERECHOS RESERVADOS
    </div>
</footer>

<script>
    const API_URL = "https://mrghnngupolsgatcmevw.supabase.co/functions/v1/actualizar-canales";
    let sessionToken = localStorage.getItem("novaplay_session_token") || "";

    async function req(body) {
        const h = { "Content-Type": "application/json" };
        if (sessionToken) h.Authorization = "Bearer " + sessionToken;
        const r = await fetch(API_URL, { method: "POST", headers: h, body: JSON.stringify(body) });
        const d = await r.json();
        if (r.status === 401) cerrarSesion();
        return d;
    }

    function UI_MostrarPanel() {
        document.getElementById("auth-view").classList.add("hidden");
        document.getElementById("main-panel").classList.remove("hidden");
        document.getElementById("navLogin").style.display = 'none';
        document.getElementById("navLogout").style.display = 'block';
        document.getElementById("navReload").style.display = 'block';
    }

    function UI_MostrarLogin() {
        document.getElementById("auth-view").classList.remove("hidden");
        document.getElementById("main-panel").classList.add("hidden");
        document.getElementById("navLogin").style.display = 'block';
        document.getElementById("navLogout").style.display = 'none';
        document.getElementById("navReload").style.display = 'none';
    }

    async function iniciarSesion() {
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;
        const btn = document.getElementById("loginButton");
        btn.disabled = true; btn.innerText = "VERIFICANDO...";

        const res = await req({ action: "login", username: u, password: p });
        if (res.token) {
            sessionToken = res.token;
            localStorage.setItem("novaplay_session_token", res.token);
            UI_MostrarPanel();
            loadData();
        } else {
            const el = document.getElementById("loginStatus");
            el.className = "status error";
            el.textContent = "Acceso denegado.";
            el.style.display = "block";
            btn.disabled = false;
            btn.textContent = 'ENTRAR AL PANEL';
        }
    }

    function cerrarSesion() { localStorage.removeItem("novaplay_session_token"); location.reload(); }

    async function loadData() {
        if (!sessionToken) return;

        // Cargar Usuarios
        const users = await req({ action: "seguridad_listar_usuarios" });
        document.getElementById('users-tbody').innerHTML = users.map(u => `
            <tr>
                <td><b>${u.usuario}</b></td>
                <td><code>${u.novaplay_id}</code></td>
                <td><code style="color:var(--primary)">${u.firma_hardware || 'N/A'}</code></td>
                <td>${u.modelo_dispositivo} <br><small>${u.version_app}</small></td>
                <td>
                    <button class="btn-icon" onclick="addBlacklist('${u.novaplay_id}')" title="Banear ID"><i class="fas fa-id-badge"></i></button>
                    <button class="btn-icon" onclick="addBlacklist('${u.firma_hardware}')" title="Banear Firma" ${u.firma_hardware ? '' : 'disabled'}><i class="fas fa-fingerprint"></i></button>
                </td>
            </tr>
        `).join('');

        // Cargar Blacklist
        const black = await req({ action: "seguridad_listar_blacklist" });
        document.getElementById('blacklist-tbody').innerHTML = black.map(b => `
            <tr>
                <td><code>${b.novaplay_id}</code></td>
                <td><button class="btn-danger-text" onclick="removeBlacklist(${b.id})">BORRAR</button></td>
            </tr>
        `).join('');

        // Cargar Logs
        const logs = await req({ action: "listar_logs" });
        document.getElementById('logs-container').innerHTML = logs.map(l => `
            <div class="log-item">
                <h4>${l.name}</h4>
                <a href="https://wxlhqitmigmkpfcsqyzt.supabase.co/storage/v1/object/public/Logs_NovaPlay/${l.name}" target="_blank" class="btn-login-nav" style="display:block; text-align:center; padding:8px; font-size:11px;">VER REPORTE</a>
            </div>
        `).join('');
    }

    async function addBlacklist(id) {
        const reason = prompt("Motivo del bloqueo:", "Actividad sospechosa detectada.");
        if (reason === null) return;
        const res = await req({ action: "seguridad_add_blacklist", novaplay_id: id, reason: reason });
        if (res.success) loadData(); else alert("Error");
    }

    async function removeBlacklist(id) {
        if (!confirm("¿Desbloquear dispositivo?")) return;
        const res = await req({ action: "seguridad_remove_blacklist", id_db: id });
        if (res.success) loadData();
    }

    document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") iniciarSesion(); });

    if (sessionToken) UI_MostrarPanel(), loadData();
    else UI_MostrarLogin();
</script>
</body>
</html>
