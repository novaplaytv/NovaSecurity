<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaPlay | Security Shield</title>
    <link rel="icon" type="image/webp" href="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #e50914;
            --primary-hover: #ff000d;
            --bg: #050505;
            --card-bg: #111111;
            --input-bg: #1a1f2e;
            --text: #ffffff;
            --text-muted: #888888;
            --border: #293246;
            --success: #10b981;
            --error: #ef4444;
            --nav-height: 70px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }

        /* Navigation */
        nav { position: fixed; top: 0; width: 100%; height: var(--nav-height); background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); z-index: 1000; display: flex; align-items: center; padding: 0 30px; justify-content: space-between; }
        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; font-weight: 900; font-size: 20px; }
        .brand img { width: 32px; border-radius: 6px; }

        /* Main Layout */
        .app-container { max-width: 1400px; margin: calc(var(--nav-height) + 40px) auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        @media (max-width: 1100px) { .app-container { grid-template-columns: 1fr; } }

        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 25px; padding: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); display: flex; flex-direction: column; }
        .card h2 { font-size: 20px; font-weight: 900; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        .card h2 i { color: var(--primary); }

        /* Table Styles */
        .table-container { flex-grow: 1; overflow-y: auto; max-height: 500px; margin-top: 10px; border-radius: 15px; background: #080a10; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #1a1f2e; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; padding: 15px; position: sticky; top: 0; z-index: 5; }
        td { padding: 15px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        tr:hover { background: rgba(255,255,255,0.02); }

        .badge { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 900; text-transform: uppercase; }
        .badge-red { background: rgba(229,9,20,0.1); color: var(--primary); }
        .badge-green { background: rgba(16,185,129,0.1); color: var(--success); }

        /* Forms */
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 11px; font-weight: 900; color: var(--text-muted); text-transform: uppercase; }
        input { width: 100%; padding: 14px 18px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: #fff; font-size: 14px; }
        input:focus { border-color: var(--primary); }

        .btn { padding: 12px 20px; border-radius: 12px; border: 0; cursor: pointer; font-weight: 800; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { transform: scale(1.05); filter: brightness(1.1); }
        .btn-danger { background: var(--error); color: #fff; }
        .btn-icon { background: none; border: none; color: inherit; cursor: pointer; padding: 5px; opacity: 0.6; }
        .btn-icon:hover { opacity: 1; color: var(--primary); }

        /* Log Monitor Section */
        .logs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .log-item { background: #080a10; border: 1px solid var(--border); padding: 15px; border-radius: 15px; position: relative; transition: 0.3s; }
        .log-item:hover { border-color: var(--primary); }
        .log-item h4 { font-size: 12px; word-break: break-all; margin-bottom: 10px; color: #ccc; }
        .log-item .date { font-size: 10px; color: var(--text-muted); }
        .log-new-indicator { position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 10px var(--primary); display: none; }

        /* Auth View */
        #auth-view { position: fixed; inset: 0; background: var(--bg); z-index: 10001; display: flex; justify-content: center; align-items: center; }
        .auth-card { width: 400px; padding: 50px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 35px; box-shadow: 0 30px 80px rgba(0,0,0,0.6); text-align: center; }

        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    </style>
</head>
<body>

<nav>
    <a href="#" class="brand">
        <img src="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp" alt="Logo">
        NovaPlay Security Shield
    </a>
    <div style="display: flex; gap: 20px; align-items: center;">
        <span id="system-status" class="badge badge-green">Sistema Protegido</span>
        <button class="btn btn-primary" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>
</nav>

<div id="auth-view">
    <div class="auth-card">
        <h2 style="margin-bottom:30px; font-weight:900; font-size: 28px;">Staff Only</h2>
        <div class="form-group" style="text-align: left;">
            <label>Contraseña Maestra</label>
            <input type="password" id="master-pass" placeholder="••••••••">
        </div>
        <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="verificarAcceso()">ACCEDER AL PANEL</button>
    </div>
</div>

<div class="app-container hidden" id="main-panel">
    <!-- Active Users Table -->
    <div class="card">
        <h2><i class="fas fa-users"></i> Sesiones Activas</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>ID Hardware</th>
                        <th>Modelo</th>
                        <th>V. App</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="users-tbody">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Blacklist Management -->
    <div class="card">
        <h2><i class="fas fa-user-slash"></i> Lista Negra (Baneos)</h2>
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <input type="text" id="blacklist-id" placeholder="Pegar ID de Hardware aquí...">
            <button class="btn btn-danger" onclick="addBlacklist()">BLOQUEAR ID</button>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID Hardware</th>
                        <th>Baneado el</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="blacklist-tbody">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Log Monitor -->
    <div class="card" style="grid-column: 1 / -1;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2><i class="fas fa-file-medical-alt"></i> Monitor de Logs (Supabase Storage)</h2>
            <button class="btn btn-primary" onclick="loadLogs()"><i class="fas fa-sync"></i> Refrescar</button>
        </div>
        <div class="logs-grid" id="logs-container">
            <!-- Dynamic Log Items -->
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://mrghnngupolsgatcmevw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_56epBVQKxWC5_OF0O8x0pA_gxDsxMbQ";

    let isLogged = localStorage.getItem("nova_shield_auth") === "true";

    function verificarAcceso() {
        const pass = document.getElementById('master-pass').value;
        if (pass === "MSGT-SECURITY-2026") {
            localStorage.setItem("nova_shield_auth", "true");
            location.reload();
        } else {
            alert("Acceso Denegado");
        }
    }

    function cerrarSesion() {
        localStorage.removeItem("nova_shield_auth");
        location.reload();
    }

    async function supabaseRequest(table, method, body = null, query = "") {
        const headers = {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=representation"
        };
        const options = { method, headers };
        if (body) options.body = JSON.stringify(body);

        const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}${query}`, options);
        return await res.json();
    }

    async function loadUsers() {
        const data = await supabaseRequest("registro_versiones", "GET", null, "?select=*&order=fecha_actualizacion.desc");
        const tbody = document.getElementById('users-tbody');
        tbody.innerHTML = data.map(u => `
            <tr>
                <td><b>${u.usuario}</b></td>
                <td><code style="color:var(--primary)">${u.novaplay_id}</code></td>
                <td>${u.modelo_dispositivo}</td>
                <td><span class="badge badge-green">${u.version_app}</span></td>
                <td>
                    <button class="btn-icon" onclick="copyToClipboard('${u.novaplay_id}')" title="Copiar ID"><i class="fas fa-copy"></i></button>
                </td>
            </tr>
        `).join('');
    }

    async function loadBlacklist() {
        const data = await supabaseRequest("blacklist", "GET", null, "?select=*&order=created_at.desc");
        const tbody = document.getElementById('blacklist-tbody');
        tbody.innerHTML = data.map(b => `
            <tr>
                <td><code>${b.novaplay_id}</code></td>
                <td class="date">${new Date(b.created_at).toLocaleString()}</td>
                <td>
                    <button class="btn-icon" onclick="removeBlacklist(${b.id})" title="Desbloquear"><i class="fas fa-trash-alt"></i></button>
                </td>
            </tr>
        `).join('');
    }

    async function addBlacklist() {
        const id = document.getElementById('blacklist-id').value.trim();
        if (!id) return;
        await supabaseRequest("blacklist", "POST", { novaplay_id: id });
        document.getElementById('blacklist-id').value = "";
        loadBlacklist();
    }

    async function removeBlacklist(id) {
        if (!confirm("¿Desea desbloquear este dispositivo?")) return;
        await supabaseRequest("blacklist", "DELETE", null, `?id=eq.${id}`);
        loadBlacklist();
    }

    async function loadLogs() {
        // Consultar la lista de archivos en el bucket Logs_NovaPlay vía API REST de Storage
        // Nota: El listado de objetos requiere el Service Role Key o permisos públicos de lectura.
        // Asumimos que los archivos son públicos para listado en este dashboard privado.
        try {
            const res = await fetch(`${SUPABASE_URL}/storage/v1/object/list/Logs_NovaPlay`, {
                method: "POST",
                headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({ prefix: "", limit: 100, sortBy: { column: "created_at", order: "desc" } })
            });
            const data = await res.json();
            const container = document.getElementById('logs-container');

            container.innerHTML = data.map(log => `
                <div class="log-item">
                    <div class="log-new-indicator"></div>
                    <h4>${log.name}</h4>
                    <div class="date">${new Date(log.created_at).toLocaleString()}</div>
                    <a href="${SUPABASE_URL}/storage/v1/object/public/Logs_NovaPlay/${log.name}" target="_blank" class="btn btn-ghost" style="margin-top:10px; width:100%; justify-content:center; padding:8px; font-size:11px;">
                        <i class="fas fa-download"></i> Ver Log
                    </a>
                </div>
            `).join('');
        } catch (e) {
            console.error("Error cargando logs", e);
        }
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text);
        alert("ID Copiado: " + text);
    }

    if (isLogged) {
        document.getElementById('auth-view').classList.add('hidden');
        document.getElementById('main-panel').classList.remove('hidden');
        loadUsers();
        loadBlacklist();
        loadLogs();
        setInterval(loadLogs, 60000); // Monitoreo automático cada minuto
    }
</script>

</body>
</html>
